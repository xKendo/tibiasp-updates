name: Publish TibiaSP update

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tibiasp-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out update sources
        uses: actions/checkout@v4

      - name: Build and verify the newest update
        id: package
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          import zipfile
          from pathlib import Path

          base = Path("packages")
          candidates = []
          for path in base.glob("v*/release.json"):
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", path.parent.name)
              if match:
                  candidates.append((tuple(map(int, match.groups())), path))

          if not candidates:
              print("No release.json yet. Waiting for the first complete update.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("ready=false\n")
              sys.exit(0)

          _, release_path = max(candidates)
          data = json.loads(release_path.read_text(encoding="utf-8-sig"))
          tag = release_path.parent.name
          version = data.get("version")
          title = data.get("title")
          filename = data.get("filename")
          if not isinstance(version, str) or tag != "v" + version:
              sys.exit("Invalid release version")
          if not isinstance(title, str) or not title.strip() or "\n" in title:
              sys.exit("Invalid release title")
          if not isinstance(filename, str) or not re.fullmatch(r"TibiaSP_v[0-9.]+_[A-Za-z0-9_]+\.zip", filename):
              sys.exit("Invalid release ZIP filename")

          source = release_path.parent / "source"
          files = sorted(p for p in source.rglob("*") if p.is_file())
          if not files or not (source / "install.ps1").is_file() or not (source / "update-package.json").is_file():
              sys.exit("Incomplete release source")

          output = Path("dist")
          output.mkdir(exist_ok=True)
          package = output / filename
          with zipfile.ZipFile(package, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in files:
                  name = path.relative_to(source).as_posix()
                  if name.startswith("/") or ".." in Path(name).parts:
                      sys.exit("Invalid package member path")
                  info = zipfile.ZipInfo(name, date_time=(2020, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  archive.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

          with zipfile.ZipFile(package) as archive:
              if archive.testzip() is not None:
                  sys.exit("ZIP integrity verification failed")
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          manifest = {
              "version": version,
              "title": title,
              "url": "https://github.com/xKendo/tibiasp-updates/releases/download/" + tag + "/" + filename,
              "sha256": digest,
          }
          manifest_path = output / "latest.json"
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("ready=true\n")
              out.write("tag=" + tag + "\n")
              out.write("zip=" + str(package) + "\n")
              out.write("manifest=" + str(manifest_path) + "\n")
              out.write("description=" + title.strip() + "\n")
          print("Verified", tag, package.name, digest)
          PY

      - name: Publish verified release assets
        if: steps.package.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          PACKAGE: ${{ steps.package.outputs.zip }}
          MANIFEST: ${{ steps.package.outputs.manifest }}
          DESCRIPTION: ${{ steps.package.outputs.description }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; not overwriting published files."
            exit 0
          fi
          gh release create "$TAG" "$PACKAGE" "$MANIFEST" \
            --target "$GITHUB_SHA" \
            --title "TibiaSP $TAG" \
            --notes "$DESCRIPTION" \
            --latest
          echo "Published $TAG"
